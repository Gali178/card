<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Alessandro Galizia — International Sales Agent</title>
<style>
  /* ============================================================
     THEME — supplier accent is injected as --accent by JS.
     Everything else stays constant across suppliers.
     ============================================================ */
  :root {
    --accent: #3b1e54;          /* set by JS on supplier switch */
    --on-accent: #ffffff;       /* set by JS: readable text on accent */
    --accent-soft: #f0eaf6;     /* set by JS: light tint for chips  */
    --accent-line: #3b1e54;     /* set by JS: border-safe accent    */
    --fill: #3b1e54;            /* set by JS: solid fill for CTAs/chips (never near-white) */
    --on-fill: #ffffff;         /* set by JS: readable text on --fill */
    --ink: #1c1b1f;
    --ink-2: #5a5763;
    --card: #ffffff;
    --page: #f4f3f6;
    --line: #e6e3ea;
    --radius: 20px;
    --speed: .45s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    transition: background-color var(--speed) ease;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 10px 40px rgba(20, 12, 40, .12);
    overflow: hidden;
    margin: 8px 0 32px;
  }

  /* ---- Accent band (re-skins per supplier) ---- */
  /* Uses the solid --fill so near-white accents (Ticli's) get a filled
     header consistent with every other brand, not a blank white strip. */
  .band {
    background: var(--fill);
    color: var(--on-fill);
    padding: 22px 22px 54px;
    transition: background-color var(--speed) ease, color var(--speed) ease;
  }
  .band-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .band-label {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .85;
  }
  .band-supplier {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .band-supplier .name {
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Supplier logo, or monogram fallback when logo is "" */
  .logo-slot {
    height: 40px;
    min-width: 40px;
    max-width: 136px;
    padding: 5px 8px;
    border-radius: 12px;
    flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.94);
    color: var(--accent-line);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .02em;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    overflow: hidden;
    transition: color var(--speed) ease, background-color var(--speed) ease;
  }
  .logo-slot img { height: 100%; max-width: 118px; object-fit: contain; }

  .tagline {
    margin-top: 14px;
    font-size: 14px;
    font-style: italic;
    opacity: .92;
    min-height: 1em;
  }
  .tagline:empty { display: none; }

  /* ---- My identity (constant) ---- */
  .me {
    padding: 0 22px 6px;
    margin-top: -34px;
  }
  .avatar {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: 4px solid var(--card);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 22px;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .me h1 { font-size: 22px; margin-top: 10px; letter-spacing: -.01em; }
  .me .title { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .me .company { color: var(--ink-2); font-size: 14px; }
  .me .bio { font-size: 14px; color: var(--ink-2); margin-top: 10px; line-height: 1.5; }

  /* ---- Supplier switcher (tabs) ---- */
  .switcher { padding: 18px 22px 0; }
  .switcher-label {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 8px;
  }
  [role="tablist"] {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  [role="tablist"]::-webkit-scrollbar { display: none; }
  [role="tab"] {
    flex: none;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    cursor: pointer;
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  [role="tab"][aria-selected="true"] {
    background: var(--fill);
    border-color: var(--accent-line); /* stays visible on white accents */
    color: var(--on-fill);
  }
  [role="tab"]:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }

  /* ---- Supplier panel (co-branded block) ---- */
  .panel {
    margin: 14px 22px 0;
    padding: 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    transition: background-color var(--speed) ease;
  }
  .panel.fading .panel-inner { opacity: 0; transform: translateY(4px); }
  .panel-inner { transition: opacity .2s ease, transform .2s ease; }
  .panel h2 {
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    font-weight: 600;
  }
  .panel .supplier-name {
    font-size: 17px;
    font-weight: 700;
    margin-top: 4px;
    color: var(--ink);
  }
  /* Country-of-origin badge ("🇮🇹 Made in Italy") */
  .origin {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-line);
    transition: background-color var(--speed) ease, border-color var(--speed) ease, color var(--speed) ease;
  }
  .origin .flag { font-size: 15px; line-height: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips:empty { display: none; }
  .chip {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--fill);
    color: var(--on-fill);
    box-shadow: inset 0 0 0 1.5px var(--accent-line); /* invisible on dark, defines edge on light */
    transition: background-color var(--speed) ease, color var(--speed) ease;
  }
  .panel .site {
    display: block;
    width: fit-content;
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent-line);
    text-decoration: none;
    transition: color var(--speed) ease;
  }
  .panel .site:hover, .panel .site:focus-visible { text-decoration: underline; }

  /* ---- Contact rows ---- */
  .contacts { padding: 18px 22px 4px; display: grid; gap: 4px; }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
  }
  .contact-row:last-child { border-bottom: none; }
  .contact-row .ico {
    width: 34px; height: 34px; flex: none;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent-line);
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--speed) ease, color var(--speed) ease;
  }
  .contact-row .ico svg { width: 17px; height: 17px; }
  .contact-row .val { font-size: 14.5px; font-weight: 600; word-break: break-all; }
  .contact-row .lbl { font-size: 11.5px; color: var(--ink-2); }
  .contact-row:hover .val, .contact-row:focus-visible .val { color: var(--accent-line); }
  .copy-btn {
    margin-left: auto;
    flex: none;
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent-line); color: var(--accent-line); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
  /* WhatsApp button on the phone row — keeps its brand green on every theme */
  .wa-btn {
    margin-left: auto;
    flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 11px 6px 9px;
    border-radius: 8px;
    border: 1.5px solid #25D366;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
  }
  .wa-btn svg { width: 15px; height: 15px; }
  .wa-btn:hover { filter: brightness(1.05); }
  .wa-btn:focus-visible { outline: 2px solid #128C7E; outline-offset: 2px; }

  /* ---- Actions ---- */
  .actions { display: flex; gap: 10px; padding: 14px 22px 24px; }
  .btn {
    flex: 1;
    font: inherit; font-size: 14px; font-weight: 700;
    padding: 13px 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background-color var(--speed) ease, color var(--speed) ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
  .btn-primary { background: var(--fill); color: var(--on-fill); box-shadow: inset 0 0 0 1.5px var(--accent-line); }
  .btn-ghost { background: var(--card); color: var(--accent-line); box-shadow: inset 0 0 0 1.5px var(--accent-line); }

  /* Toast for "copied" feedback */
  .toast {
    position: fixed;
    left: 50%; bottom: 24px;
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: #fff;
    font-size: 13px; font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Hide any element flagged empty by JS */
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main class="card">
  <!-- Accent band: supplier logo + tagline live here -->
  <header class="band">
    <div class="band-top">
      <span class="band-label">In partnership with</span>
      <div class="band-supplier">
        <span class="name" id="bandSupplierName"></span>
        <span class="logo-slot" id="logoSlot" role="img"></span>
      </div>
    </div>
    <p class="tagline" id="tagline"></p>
  </header>

  <!-- My identity: constant across suppliers -->
  <section class="me" aria-label="Contact identity">
    <div class="avatar" id="avatar" role="img"></div>
    <h1 id="myName"></h1>
    <p class="title" id="myTitle"></p>
    <p class="company" id="myCompany"></p>
    <p class="bio" id="myBio"></p>
  </section>

  <!-- Supplier switcher -->
  <nav class="switcher" aria-label="Supplier selector">
    <p class="switcher-label" id="switcherLabel">Select a brand</p>
    <div role="tablist" aria-labelledby="switcherLabel" id="tablist"></div>
  </nav>

  <!-- Supplier-specific block -->
  <section class="panel" id="panel" role="tabpanel" aria-live="polite">
    <div class="panel-inner">
      <h2>I represent</h2>
      <p class="supplier-name" id="panelSupplierName"></p>
      <p class="origin" id="supplierOrigin" hidden></p>
      <div class="chips" id="chips"></div>
      <a class="site" id="supplierSite" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <!-- Contact rows -->
  <div class="contacts" id="contacts"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="vcardBtn" type="button">Save contact</button>
    <a class="btn btn-ghost" id="emailBtn">Email me</a>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = (id) => document.getElementById(id);

/* --- Color helpers: guarantee readable text on any accent --- */
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const f = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
  return [0, 2, 4].map(i => parseInt(f.slice(i, i + 2), 16));
}
function luminance([r, g, b]) {
  const a = [r, g, b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function mix(rgb, target, amount) { // blend toward target color
  return rgb.map((v, i) => Math.round(v + (target[i] - v) * amount));
}
const css = (rgb) => `rgb(${rgb.join(",")})`;

/* Apply a supplier's accent to the CSS custom properties.
   Light accents (like white) get dark text and a darkened
   "line" variant so borders, links and buttons stay visible. */
function applyTheme(s) {
  const rgb = hexToRgb(s.accent);
  // Pick whichever ink (near-black or white) has the higher WCAG
  // contrast ratio against the accent — never trust a hue threshold.
  const L = luminance(rgb);
  const contrastDarkInk = (L + 0.05) / 0.061;   // vs #1C1B1F
  const contrastWhiteInk = 1.05 / (L + 0.05);   // vs #FFFFFF
  const isLight = contrastDarkInk >= contrastWhiteInk;
  // Optional s.detail: a second brand color (e.g. Ticli's gold) that takes
  // over text, borders, links and tints when the accent itself is too light.
  const detail = s.detail ? hexToRgb(s.detail) : null;
  const tint = detail || rgb;
  const root = document.documentElement.style;
  root.setProperty("--accent", s.accent);
  root.setProperty("--on-accent", isLight ? (s.detail || "#1C1B1F") : "#FFFFFF");
  root.setProperty("--accent-line", detail ? s.detail : css(isLight ? mix(rgb, [28, 27, 31], 0.72) : rgb));
  root.setProperty("--accent-soft", css(mix(tint, [255, 255, 255], isLight ? (detail ? 0.88 : 0.55) : 0.90)));
  root.setProperty("--page", css(mix(tint, [244, 243, 246], 0.92)));

  // Solid fill for CTAs / chips / active tab. A near-white accent can't fill
  // against the white card, so fall back to detail (or a darkened accent).
  const tooPale = L > 0.82;
  const fill = tooPale ? (s.detail || css(mix(rgb, [28, 27, 31], 0.72))) : s.accent;
  const onFill = tooPale ? "#FFFFFF" : (isLight ? (s.detail || "#1C1B1F") : "#FFFFFF");
  root.setProperty("--fill", fill);
  root.setProperty("--on-fill", onFill);
}

const monogram = (name) =>
  name.split(/\s+/).map(w => w[0]).filter(Boolean).slice(0, 2).join("").toUpperCase();

/* --- Render supplier-specific content --- */
function renderSupplier(i) {
  const s = SUPPLIERS[i];
  applyTheme(s);

  // With a real logo the band name is redundant (and crowds the row)
  $("bandSupplierName").textContent = s.name;
  $("bandSupplierName").hidden = !!s.logo;
  $("tagline").textContent = s.tagline || "";

  // Logo, or colored monogram fallback
  const slot = $("logoSlot");
  slot.setAttribute("aria-label", s.name + " logo");
  slot.innerHTML = "";
  slot.style.background = s.logoBg === "accent" ? "var(--accent-line)" : "";
  if (s.logo) {
    const img = document.createElement("img");
    img.src = s.logo;
    img.alt = "";
    img.onerror = () => { slot.textContent = monogram(s.name); };
    slot.appendChild(img);
  } else {
    slot.textContent = monogram(s.name);
  }

  $("panelSupplierName").textContent = s.name;

  // Country-of-origin badge
  const origin = $("supplierOrigin");
  if (s.country) {
    origin.hidden = false;
    origin.innerHTML = "";
    if (s.flag) {
      const f = document.createElement("span");
      f.className = "flag";
      f.setAttribute("aria-hidden", "true");
      f.textContent = s.flag;
      origin.appendChild(f);
    }
    origin.appendChild(document.createTextNode("Made in " + s.country));
  } else {
    origin.hidden = true;
  }

  const chips = $("chips");
  chips.innerHTML = "";
  (s.services || []).forEach(svc => {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = svc;
    chips.appendChild(c);
  });

  const site = $("supplierSite");
  if (s.site) {
    site.hidden = false;
    site.href = s.site;
    site.textContent = s.site.replace(/^https?:\/\/(www\.)?/, "") + " ↗";
  } else {
    site.hidden = true;
  }

  // Co-branded email: supplier address when provided, personal otherwise
  const em = s.email || ME.email;
  const emailRow = $("emailRow");
  if (emailRow && em) {
    emailRow.href = "mailto:" + em;
    emailRow.querySelector(".val").textContent = em;
  }
  if (em) $("emailBtn").href = "mailto:" + em;

  // Update tab states, keeping the active tab in view
  document.querySelectorAll('[role="tab"]').forEach((t, ti) => {
    const on = ti === i;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
    if (on) t.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
}

/* Switch with a brief fade on the panel content */
let current = 0;
const activeEmail = () => SUPPLIERS[current].email || ME.email;
function selectSupplier(i, focusTab) {
  if (i === current && document.querySelector('[aria-selected="true"]')) return;
  current = i;
  const panel = $("panel");
  panel.classList.add("fading");
  setTimeout(() => {
    renderSupplier(i);
    panel.classList.remove("fading");
    if (focusTab) document.querySelectorAll('[role="tab"]')[i].focus();
  }, 180);
}

/* --- Build tabs (keyboard: arrows + Home/End) --- */
function buildTabs() {
  const list = $("tablist");
  SUPPLIERS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === 0);
    b.setAttribute("aria-controls", "panel");
    b.id = "tab-" + i;
    b.tabIndex = i === 0 ? 0 : -1;
    b.textContent = s.name;
    b.addEventListener("click", () => selectSupplier(i));
    list.appendChild(b);
  });
  list.addEventListener("keydown", (e) => {
    const n = SUPPLIERS.length;
    let next = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (current + 1) % n;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (current - 1 + n) % n;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = n - 1;
    if (next !== null) { e.preventDefault(); selectSupplier(next, true); }
  });
}

/* --- Render my constant identity, hiding empty fields --- */
function renderMe() {
  $("myName").textContent = ME.name;
  setOrHide("myTitle", ME.title);
  setOrHide("myCompany", ME.company);
  setOrHide("myBio", ME.bio);

  const av = $("avatar");
  av.setAttribute("aria-label", "Photo of " + ME.name);
  if (ME.photo) {
    const img = document.createElement("img");
    img.src = ME.photo;
    img.alt = "";
    img.onerror = () => { av.textContent = monogram(ME.name); };
    av.appendChild(img);
  } else {
    av.textContent = monogram(ME.name);
  }

  buildContacts();

  // href is kept in sync per supplier by renderSupplier
  if (!ME.email && !SUPPLIERS.some(s => s.email)) $("emailBtn").hidden = true;
}

function setOrHide(id, value) {
  const el = $(id);
  if (value) el.textContent = value; else el.hidden = true;
}

const ICONS = {
  phone:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  email:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',

  whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.8-.9-2-1s-.5-.2-.7.1-.8 1-.9 1.1-.3.2-.6.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.5-.5.3-.5v-.5l-1-2.3c-.2-.6-.5-.5-.7-.5H8c-.2 0-.5 0-.8.3a3 3 0 0 0-1 2.2c0 1.3 1 2.6 1.1 2.8s1.9 2.9 4.6 4c.6.3 1.1.5 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.3-.6.3-1.2.2-1.3s-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2zm0 18.3c-1.5 0-3-.4-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.3 8.3 0 1 1 12 20.3z"/></svg>'
};

/* WhatsApp number in wa.me form (digits only), or "" if disabled */
function waNumber() {
  const raw = ME.whatsapp === "same" ? ME.phone : ME.whatsapp;
  return raw ? raw.replace(/[^\d]/g, "") : "";
}

function buildContacts() {
  const wrap = $("contacts");
  const rows = [
    ME.phone    && { icon: "phone",    label: "Phone",    value: ME.phone,   href: "tel:" + ME.phone.replace(/\s+/g, ""), wa: waNumber() },
    (ME.email || SUPPLIERS.some(s => s.email))
                && { icon: "email",    label: "Email",    value: ME.email,   href: "mailto:" + ME.email, copy: true, id: "emailRow" },
    ME.website  && { icon: "website",  label: "Website",  value: ME.website.replace(/^https?:\/\/(www\.)?/, ""), href: ME.website, blank: true },
    ME.linkedin && { icon: "linkedin", label: "LinkedIn", value: ME.linkedin.replace(/^https?:\/\/(www\.)?/, ""), href: ME.linkedin, blank: true }
  ].filter(Boolean);

  rows.forEach(r => {
    const a = document.createElement("a");
    a.className = "contact-row";
    if (r.id) a.id = r.id;
    a.href = r.href;
    if (r.blank) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML =
      '<span class="ico">' + ICONS[r.icon] + '</span>' +
      '<span><span class="lbl">' + r.label + '</span><br><span class="val"></span></span>';
    a.querySelector(".val").textContent = r.value;

    if (r.copy) {
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.type = "button";
      btn.textContent = "Copy";
      btn.setAttribute("aria-label", "Copy email address");
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        copyText(activeEmail());
      });
      a.appendChild(btn);
    }
    if (r.wa) {
      // a button (not a nested <a>, which would be invalid inside the row link)
      const wa = document.createElement("button");
      wa.className = "wa-btn";
      wa.type = "button";
      wa.setAttribute("aria-label", "Scrivimi su WhatsApp");
      wa.innerHTML = ICONS.whatsapp + "<span>WhatsApp</span>";
      wa.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://wa.me/" + r.wa, "_blank", "noopener");
      });
      a.appendChild(wa);
    }
    wrap.appendChild(a);
  });
}

/* Clipboard with fallback for older browsers / file:// quirks */
function copyText(text) {
  const done = () => toast("Email copied ✓");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else {
    legacyCopy(text, done);
  }
}
function legacyCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (_) { toast("Copy failed — long-press to select"); }
  document.body.removeChild(ta);
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* --- vCard download (offline, no libraries) --- */
function downloadVCard() {
  const parts = ME.name.trim().split(/\s+/);
  const last = parts.length > 1 ? parts.pop() : "";
  const first = parts.join(" ");
  const workEmail = SUPPLIERS[current].email; // co-branded address, if any
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:" + last + ";" + first + ";;;",
    "FN:" + ME.name,
    ME.title    && "TITLE:" + ME.title,
    ME.company  && "ORG:" + ME.company,
    ME.phone    && "TEL;TYPE=CELL:" + ME.phone.replace(/\s+/g, ""),
    workEmail   && "EMAIL;TYPE=INTERNET,WORK,PREF:" + workEmail,
    ME.email    && "EMAIL;TYPE=INTERNET" + (workEmail ? ",HOME" : "") + ":" + ME.email,
    ME.website  && "URL:" + ME.website,
    ME.linkedin && "URL:" + ME.linkedin,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");

  const blob = new Blob([lines], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ME.name.replace(/\s+/g, "-") + ".vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* --- Boot --- */
renderMe();
buildTabs();
renderSupplier(0);
$("vcardBtn").addEventListener("click", downloadVCard);
</script>
